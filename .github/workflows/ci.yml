name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: beekle_bridge_test
          MYSQL_USER: beekle
          MYSQL_PASSWORD: test-db-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ubeekle -ptest-db-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: beekle
      DATABASE_PASSWORD: test-db-password
      DATABASE_NAME: beekle_bridge_test
      BRIDGE_PROVIDER: fake
      BRIDGE_ENVIRONMENT: sandbox
      BRIDGE_ALLOW_PRODUCTION: "false"
      BRIDGE_BASE_URL: https://api.sandbox.bridge.xyz/v0
      OPERATOR_API_KEY: test-operator-key
      MERCHANT_API_KEYS: demo-merchant:test-merchant-key
      RECONCILE_INTERVAL_MS: "0"
      COMPLIANCE_VERIFIER: local_demo
      LOCAL_DEMO_APPROVAL_REFS: dec_local_demo
      DEPOSIT_INSTRUCTION_STORAGE: redacted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
